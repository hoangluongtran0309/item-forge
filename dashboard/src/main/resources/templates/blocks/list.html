<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Custom Blocks</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-5 flex flex-wrap items-center gap-3">
        <div class="min-w-0 flex-1">
            <h1 class="font-display text-2xl font-bold">Custom Blocks</h1>
            <p class="itemforge-tech-label" th:text="${blocks.size()} + ' registered'">0 registered</p>
        </div>
        <input type="search" class="input input-bordered input-sm w-full sm:w-56"
               placeholder="Filter by name, id, instrument" data-filter-target="#blocks-grid"/>
        <a th:href="@{/blocks/new}" class="btn btn-primary btn-sm">+ New Custom Block</a>
    </div>

    <div th:if="${blocks.isEmpty()}" class="text-center py-16 text-base-content/60">
        No custom blocks yet. Create your first one to get started.
    </div>

    <div id="blocks-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <div class="block-card card bg-base-100 border-2 border-base-300 rounded-box hover:border-primary/60 transition-colors shadow-sm"
             th:each="block : ${blocks}"
             th:attr="data-filter-text=${#strings.toLowerCase(block.plainDisplayName() + ' ' + block.id() + ' '
                     + block.instrument() + ' ' + block.textureId())}">
            <div class="card-body p-4 gap-2">
                <div class="flex items-start gap-3">
                    <div th:replace="~{fragments/texture-thumb :: thumb(
                             url=@{/blocks/{id}/texture(id=${block.id()})},
                             sizeClass='w-16 h-16 text-xl',
                             fallbackLetter=${#strings.isEmpty(block.plainDisplayName()) ? '?' : #strings.substring(block.plainDisplayName(), 0, 1)})}"></div>
                    <div class="min-w-0">
                        <h2 class="font-display font-semibold truncate" th:text="${block.plainDisplayName()}">Display Name</h2>
                        <p class="itemforge-tech-label truncate" th:text="${block.id()}">id</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-1">
                    <span class="badge badge-outline" th:text="${block.instrument()}">INSTRUMENT</span>
                    <span class="badge badge-outline font-mono" th:text="'note ' + ${block.note()}">note 0</span>
                </div>
                <div class="card-actions justify-end mt-2">
                    <a th:href="@{/studio(type='block',id=${block.id()})}" class="btn btn-ghost btn-xs"
                       title="Open the Texture Studio">Studio</a>
                    <a th:href="@{/blocks/{id}/edit(id=${block.id()})}" class="btn btn-ghost btn-xs">Edit</a>
                    <button type="button"
                            class="btn btn-error btn-outline btn-xs"
                            th:attr="hx-delete=@{/blocks/{id}(id=${block.id()})}"
                            hx-target="closest .block-card" hx-swap="outerHTML swap:200ms"
                            hx-confirm="Delete this custom block? This cannot be undone.">
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div id="filter-empty-state" hidden="hidden" class="py-12 text-center text-base-content/60">
        Nothing matches that filter.
    </div>
</div>
</body>
</html>
