name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)publish, e.g. v1.0.0'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Resolve version from tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The single most important guard here: a tag whose name disagrees with the
      # poms would publish jars that do not match their own release page.
      - name: Verify poms match the tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          plugin=$(mvn -q -ntp -DforceStdout help:evaluate -Dexpression=project.version)
          dashboard=$(cd dashboard && ./mvnw -q -ntp -DforceStdout help:evaluate -Dexpression=project.version)
          failed=0
          if [ "$plugin" != "$VERSION" ]; then
            echo "::error::pom.xml is $plugin but the tag says $VERSION"
            failed=1
          fi
          if [ "$dashboard" != "$VERSION" ]; then
            echo "::error::dashboard/pom.xml is $dashboard but the tag says $VERSION"
            failed=1
          fi
          exit $failed

      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::This commit is not on main -- releases are cut from main only"
            exit 1
          fi

      # -U because paper-api is a SNAPSHOT: without it a stale copy from the
      # restored ~/.m2 cache could end up inside a published jar.
      - name: Build plugin
        run: mvn -B -ntp -U clean package

      - name: Build dashboard
        working-directory: dashboard
        run: ./mvnw -B -ntp -U clean package -Prelease

      - name: Collect artifacts and checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          cp "target/itemforge-$VERSION.jar" dist/
          cp "dashboard/target/dashboard-$VERSION.jar" dist/
          cd dist
          sha256sum itemforge-*.jar dashboard-*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md -- publishing without notes"
            echo "See CHANGELOG.md for the changes in this release." > RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ItemForge ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true

      # git-flow back-merge: the release commit (version bump, changelog date)
      # only exists on main and has to come back to develop.
      - name: Open back-merge PR into develop
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh pr create \
            --base develop --head main \
            --title "chore: back-merge v$VERSION into develop" \
            --body "Brings the v$VERSION release commit back to develop. Merge with a merge commit." \
            || echo "Nothing to back-merge (or a PR already exists)."
