name: Prepare release

# Bumps every version in the repository and opens the release PR, so cutting a
# release never means editing pom.xml by hand. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.1.0)'
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Bump versions and open the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Validate the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version -- expected e.g. 1.1.0, with no leading v"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          (cd dashboard && ./mvnw -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false)
          # package.json carries its own version and drifts from the pom unless
          # it is bumped in the same step.
          (cd dashboard && npm version "$VERSION" --no-git-tag-version --allow-same-version)

      - name: Open the CHANGELOG section for this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG already has a [$VERSION] section, leaving it alone."
            exit 0
          fi
          awk -v v="$VERSION" -v d="$(date -u +%F)" '
            !inserted && /^## \[Unreleased\]/ {
              print; print ""; print "## [" v "] - " d
              inserted = 1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit, push and open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/$VERSION"
          git commit -am "chore(release): prepare v$VERSION"
          git push -u origin "release/$VERSION"
          gh pr create \
            --base main --head "release/$VERSION" \
            --title "Release v$VERSION" \
            --body "$(printf '%s\n' \
              "Version bump prepared by the \`prepare-release\` workflow." \
              "" \
              "Before merging:" \
              "" \
              "- [ ] The \`## [$VERSION]\` section of \`CHANGELOG.md\` describes this release" \
              "- [ ] CI is green" \
              "" \
              "After merging, tag the merge commit to publish:" \
              "" \
              '```' \
              "git switch main && git pull" \
              "git tag -a v$VERSION -m \"ItemForge v$VERSION\"" \
              "git push origin v$VERSION" \
              '```')"
